<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="facet3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#orbGlow)"/>
  <!-- Outer Crystal Polygon -->
  <polygon points="50,14 78,26 86,54 70,80 50,88 30,80 14,54 22,26" fill="#14142b" stroke="#818cf8" stroke-width="2"/>
  <!-- Facets -->
  <polygon points="50,14 78,26 64,48 50,34" fill="url(#facet1)" opacity="0.9"/>
  <polygon points="78,26 86,54 64,56 64,48" fill="url(#facet2)" opacity="0.85"/>
  <polygon points="86,54 70,80 50,68 64,56" fill="url(#facet1)" opacity="0.9"/>
  <polygon points="70,80 50,88 50,68" fill="url(#facet3)" opacity="0.85"/>
  <polygon points="50,88 30,80 50,68" fill="url(#facet2)" opacity="0.85"/>
  <polygon points="30,80 14,54 36,56 50,68" fill="url(#facet1)" opacity="0.9"/>
  <polygon points="14,54 22,26 36,48 36,56" fill="url(#facet2)" opacity="0.85"/>
  <polygon points="22,26 50,14 50,34 36,48" fill="url(#facet3)" opacity="0.9"/>
  <!-- Inner Facets Core -->
  <polygon points="50,34 64,48 64,56 50,68 36,56 36,48" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Glowing Center Star -->
  <path d="M50 36 Q50 50 64 50 Q50 50 50 64 Q50 50 36 50 Q50 50 50 36 Z" fill="#ffffff" filter="url(#glowFilter)"/>
  <circle cx="50" cy="50" r="3.5" fill="#ffffff"/>
